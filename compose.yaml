# Local development stack for NunezOrganizer.
# PHP 8.4 (matches production minimum), MariaDB 10.11 LTS, Mailpit.
# Usage: see README.md → "Local development (Docker)".
name: nunezorganizer

services:
  app:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
    image: nunezorganizer-php:8.4
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy

  queue:
    image: nunezorganizer-php:8.4
    command: php artisan queue:listen --tries=1 --queue=notifications,default
    volumes:
      - .:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    profiles: ["workers"]

  scheduler:
    image: nunezorganizer-php:8.4
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    profiles: ["workers"]

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nunezorganizer
      MARIADB_USER: nunezorganizer
      MARIADB_PASSWORD: secret
    ports:
      - "${FORWARD_DB_PORT:-33306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mariadb-data:
