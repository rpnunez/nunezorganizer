name: deploy-scripts

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-scripts.yml"
  push:
    branches: [master]
    paths:
      - "deploy/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck age
      - name: Run deploy test suite
        run: bash deploy/tests/run.sh
