name: deploy-scripts

on:
  pull_request:
    paths:
      - "deploy/**"
      - "setup.php"
      - ".env.example"
      - ".github/workflows/deploy-scripts.yml"
  push:
    branches: [master]
    paths:
      - "deploy/**"
      - "setup.php"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck age
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, bcmath, mbstring
          coverage: none
      - name: Run deploy + setup test suites
        run: bash deploy/tests/run.sh
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet
