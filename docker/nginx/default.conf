# NunezOrganizer development vhost: serves public/, passes PHP to the app (FPM) service.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # Long timeout so a request paused on an Xdebug breakpoint isn't cut off.
        fastcgi_read_timeout 3600;
    }

    # Never serve dotfiles (.env, .git, ...) except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
