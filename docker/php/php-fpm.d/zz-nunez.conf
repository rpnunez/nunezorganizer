; FPM runs as the unprivileged "app" user (see Dockerfile), so the pool's
; user/group directives would only produce warnings. Listen on all interfaces
; so the nginx container can reach it.
[www]
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; A paused Xdebug session must not be killed mid-debugging.
request_terminate_timeout = 0
