; Xdebug 3, on demand. A session starts only when triggered: the XDEBUG_TRIGGER
; cookie/GET/POST parameter (browser extension) or the XDEBUG_TRIGGER env var (CLI).
; The XDEBUG_MODE env var overrides xdebug.mode: "off" disables it, "coverage" for
; code coverage, "debug,develop" adds develop helpers (slower).
; client_host/client_port come from XDEBUG_CONFIG in docker-compose.yml.
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9013
xdebug.discover_client_host = 0
xdebug.idekey = VSCODE
; Don't log "could not connect to debugging client" on every triggered request
; when VS Code isn't listening.
xdebug.log_level = 0
xdebug.max_nesting_level = 512
