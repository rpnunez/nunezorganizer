; Development defaults for the NunezOrganizer Docker image.
memory_limit = 1G
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 0
date.timezone = UTC
display_errors = On
error_reporting = E_ALL
expose_php = Off

; Pick up code changes immediately.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
